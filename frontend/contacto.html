<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Tienda — Contacto</title>

  <!-- Fuente moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- ===== BARRA DE NAVEGACIÓN (NAVBAR) ===== -->
  <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="contenedor" id="inicio">
    <div class="encabezado-principal">
      <h1>Contacto</h1>
    </div>

    <div class="panel-tienda">
      <!-- Formulario de Contacto -->
      <section class="tarjeta" id="contacto">
        <h2 id="tituloFormulario">Comunícate con nosotros</h2>

        <form id="formularioContacto">
          <!-- Campo oculto para almacenar el ID en caso de edición -->
          <input type="hidden" id="productoId" value="" />
          <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="contactoNombre" placeholder="Ej: Karol Velasco" required />
          </div>

          <div class="campo">
            <label for="correo">Correo:</label>
            <input type="email" id="contactoEmail" placeholder="Ej: karol@correo.com" required />
          </div>

          <div class="campo">
            <label for="asunto">Asunto:</label>
            <input type="text" id="contactoAsunto" placeholder="Ej: Consulta sobre un producto" required />
          </div>

          <div class="campo">
            <label for="mensaje">Mensaje:</label>
            <textarea id="contactoMensaje" rows="4" placeholder="Escribe tu mensaje" required></textarea>
          </div>

          <div class="acciones-form">
            <button type="submit" id="btnEnviarMensaje" class="btn btn-guardar">Enviar mensaje</button>
          </div>
        </form>
      </section>

      <!-- SECCIÓN 2: Lista de Mensajes -->
      <section class="tarjeta" id="mensajes">
        <h2>Lista de Mensajes</h2>
        <div id="listaMensajes" class="lista-productos">
          <!-- Los mensajes se cargan desde app.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- ===== PIE DE PÁGINA (FOOTER) ===== -->
  <footer class="footer">
    <div class="contenedor footer-contenido">
      <p>&copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
